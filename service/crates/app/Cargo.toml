[package]
name = "app"
default-run = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
zcash.workspace = true
zama.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-postgres.workspace = true
sha2 = "=0.10.9"
sha3 = "=0.10.9"
hex = "=0.4.3"
axum = "=0.8.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
subtle = "=2.6.1"
alloy = { version = "=1.8.3", features = ["eip712"] }
chacha20poly1305 = "=0.11.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
zeroize = "=1.9.1"

[dev-dependencies]
orchard = { version = "=0.16.0", default-features = false, features = ["std", "zeroize"] }
incrementalmerkletree = { version = "=0.9.0", features = ["legacy-api"] }
zcash_primitives = { version = "=0.31.0", default-features = false, features = ["std", "circuits"] }
tonic = { version = "=0.14.6", features = ["transport"] }
tonic-prost = "=0.14.6"
prost = "=0.14.1"
tokio-stream = { version = "=0.1.19", features = ["net"] }
zeroize = "=1.9.1"
