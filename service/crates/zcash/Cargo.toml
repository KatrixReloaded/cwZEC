[package]
name = "zcash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
orchard = { version = "=0.16.0", default-features = false, features = ["std", "zeroize"] }
zcash_address = "=0.14.0"
zcash_protocol = { version = "=0.11.0", default-features = false, features = ["std"] }
zip32 = "=0.3.0"
zeroize = "=1.9.1"
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
rand_core = "=0.10.1"
sapling-crypto = { version = "=0.9.0", default-features = false, features = ["circuit"] }
zcash_transparent = { version = "=0.11.0", default-features = false, features = ["std"] }
bls12_381 = "=0.9.0"
jubjub = "=0.11.1"
tokio.workspace = true
tonic = { version = "=0.14.6", features = ["transport", "tls-native-roots", "tls-ring"] }
tonic-prost = "=0.14.6"
prost = "=0.14.1"
serde = { version = "=1.0.229", features = ["derive"] }
hex = "=0.4.3"
incrementalmerkletree = { version = "=0.9.0", features = ["legacy-api"] }
zcash_primitives = { version = "=0.31.0", default-features = false, features = ["std", "circuits"] }
zcash_note_encryption = "=0.5.1"

[dev-dependencies]
serde_json = "=1.0.154"
tokio-stream = { version = "=0.1.19", features = ["net"] }
nonempty = "=0.11.0"
sha3 = "=0.10.9"
pczt = { version = "=0.10.0", default-features = false, features = ["std", "orchard"] }
